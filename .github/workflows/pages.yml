# Publica el dashboard en GitHub Pages (modo demo, con datos simulados)
name: Pages

on:
  push:
    branches: [main]
    paths: ['nube/frontend/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nube/frontend
      - id: deployment
        uses: actions/deploy-pages@v4
